version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: triad_data_lake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-create-buckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 admin minioadmin123;
      mc mb myminio/uz-stock-data || true;
      mc mb myminio/hh-jobs-data || true;
      mc mb myminio/linkid-data || true;
      mc mb myminio/cross-project-analytics || true;
      mc anonymous set none myminio/uz-stock-data;
      mc anonymous set none myminio/hh-jobs-data;
      mc anonymous set none myminio/linkid-data;
      mc anonymous set none myminio/cross-project-analytics;
      exit 0;
      "

volumes:
  minio_data:
