[project]
name = "expert-consilium"
version = "0.1.0"
description = "Консилиум Экспертов — Telegram бот + 5 ИИ-экспертов"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.17",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis[hiredis]>=5.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "python-dotenv>=1.0",
]

[project.scripts]
consilium-api = "src.main:run_api"
consilium-bot = "src.bot:run_bot"
consilium-worker = "src.worker:run_worker"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true