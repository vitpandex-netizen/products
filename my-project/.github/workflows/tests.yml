name: Tests & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies (HH Jobs)
      run: |
        python -m pip install --upgrade pip
        pip install -r hh-jobs/requirements.txt

    - name: Run tests (HH Jobs)
      run: |
        pytest hh-jobs/tests/ -v --cov=hh-jobs/src --cov-report=xml

    - name: Code quality checks (HH Jobs)
      run: |
        black --check hh-jobs/src hh-jobs/tests
        flake8 hh-jobs/src hh-jobs/tests

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
