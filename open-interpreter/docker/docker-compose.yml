version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: interp-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: interp
      POSTGRES_PASSWORD: interp_secret
      POSTGRES_DB: interp
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
