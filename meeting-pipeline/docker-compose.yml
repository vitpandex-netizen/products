services:
  meeting-pipeline:
    build: .
    container_name: meeting-pipeline
    ports:
      - "8001:8001"
    environment:
      - MEETING_SERVICE_PORT=8001
      - TRANSCRIBE_SERVICE_URL=http://transcribe-service:8000
    volumes:
      - /Users/vitaliyr/.secure:/root/.secure:ro
      - /tmp/meeting_pipeline:/tmp/meeting_pipeline
      - /Users/vitaliyr/Library/Application Support/Interpreter/local-transcribe:/root/.local-transcribe:ro
    networks:
      - transcribe-net

networks:
  transcribe-net:
    external: true
