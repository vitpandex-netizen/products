<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Admin — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; width: 380px; }
h1 { font-size: 24px; margin-bottom: 8px; color: #58a6ff; text-align: center; }
.subtitle { font-size: 14px; color: #8b949e; text-align: center; margin-bottom: 24px; }
label { display: block; font-size: 14px; color: #8b949e; margin-bottom: 6px; }
input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; margin-bottom: 16px; }
input:focus { outline: none; border-color: #58a6ff; }
button { width: 100%; padding: 10px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
button:hover { background: #2ea043; }
.error { background: #3b1e1e; border: 1px solid #da3633; border-radius: 6px; padding: 10px; margin-bottom: 16px; font-size: 13px; color: #f85149; }
.footer { text-align: center; margin-top: 16px; font-size: 12px; color: #484f58; }
</style>
</head>
<body>
<div class="login-box">
  <h1>🔐 Вход в Hermes Admin</h1>
      <p class="subtitle">Управление сервисами, проектами и мониторингом</p>
  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="error">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  
  <form method="POST">
    <label for="username">Логин</label>
    <input type="text" id="username" name="username" placeholder="admin" required autofocus>
    
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" placeholder="••••••••" required>
    
    <button type="submit">Войти</button>
  </form>
  
  <div class="footer">Hermes Admin Panel v2.0 &copy; {{ year }} · <a href="http://100.84.223.96/" style="color:#484f58;">← На Hub</a></div>
</div>
</body>
</html>
