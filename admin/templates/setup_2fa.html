<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2FA — Hermes Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; width: 420px; }
h1 { font-size: 22px; margin-bottom: 12px; color: #58a6ff; text-align: center; }
p { font-size: 14px; color: #8b949e; text-align: center; margin-bottom: 20px; }
code { display: block; background: #0d1117; padding: 12px; border-radius: 6px; font-size: 14px; color: #f0f6fc; text-align: center; margin: 12px 0; word-break: break-all; }
img { display: block; margin: 16px auto; max-width: 200px; }
input[type="text"] { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 18px; text-align: center; letter-spacing: 4px; margin-bottom: 16px; }
input:focus { outline: none; border-color: #58a6ff; }
button { width: 100%; padding: 10px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; }
button:hover { background: #2ea043; }
</style>
</head>
<body>
<div class="box">
  <h1>🔐 Настройка 2FA</h1>
  <p>Отсканируй QR-код в приложении (Google Authenticator, Authy)</p>
  
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={{ uri | urlencode }}" alt="QR Code">
  
  <p>Или введи ключ вручную:</p>
  <code>{{ secret }}</code>
  
  <form action="/confirm-2fa" method="POST">
    <p>Подтверди код из приложения:</p>
    <input type="text" name="code" placeholder="000000" maxlength="6" required autofocus>
    <button type="submit">✅ Подтвердить</button>
  </form>
</div>
</body>
</html>
