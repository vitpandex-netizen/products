<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a14;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
    border-bottom: 1px solid #2a2a4a;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-logo { font-size: 36px; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .subtitle { color: #64748b; font-size: 13px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .stats {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: #94a3b8;
  }
  .stats span { display: flex; align-items: center; gap: 4px; }
  .dot-online { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; display: inline-block; }
  .dot-offline { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; display: inline-block; }
  .filters {
    display: flex;
    gap: 8px;
    padding: 16px 32px;
    flex-wrap: wrap;
    border-bottom: 1px solid #1a1a2e;
  }
  .filter-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid #2a2a4a;
    background: transparent;
    color: #94a3b8;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: #6366f1; color: #e2e8f0; }
  .filter-btn.active { background: #6366f1; border-color: #6366f1; color: white; }
  .search {
    padding: 12px 32px;
  }
  .search input {
    width: 100%;
    max-width: 400px;
    padding: 10px 16px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
  }
  .search input:focus { border-color: #6366f1; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    padding: 16px 32px 32px;
  }
  .card {
    background: #12121e;
    border: 1px solid #1e1e32;
    border-radius: 14px;
    padding: 20px;
    transition: all 0.2s;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: #6366f1;
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(99,102,241,0.12);
  }
  .card.starred::before {
    content: '⭐';
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 14px;
  }
  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .card-icon {
    font-size: 28px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .card-desc {
    font-size: 12px;
    color: #64748b;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .card-tag {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 500;
  }
  .card-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid #1a1a2e;
  }
  .status-badge {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .status-badge.online { color: #22c55e; }
  .status-badge.offline { color: #ef4444; }
  .status-badge.dev { color: #f59e0b; }
  .card-actions {
    display: flex;
    gap: 6px;
  }
  .card-actions a {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    text-decoration: none;
    transition: all 0.15s;
  }
  .btn-open {
    background: #6366f1;
    color: white;
  }
  .btn-open:hover { background: #4f46e5; }
  .btn-repo {
    background: #1a1a2e;
    color: #94a3b8;
    border: 1px solid #2a2a4a;
  }
  .btn-repo:hover { border-color: #6366f1; color: #e2e8f0; }
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60vh;
    font-size: 18px;
    color: #64748b;
  }
  .loading .spinner {
    width: 24px; height: 24px;
    border: 2px solid #2a2a4a;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #64748b;
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #334155;
    border-top: 1px solid #1a1a2e;
  }
  .footer span { color: #6366f1; }
  @media (max-width: 640px) {
    .header { padding: 16px; }
    .grid { padding: 12px; grid-template-columns: 1fr; }
    .filters { padding: 12px 16px; }
    .search { padding: 8px 16px; }
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-logo">🖥️</div>
      <div>
        <h1>Infrastructure Portal</h1>
        <div class="subtitle">Все проекты сервера instance-20260807-1651</div>
      </div>
    </div>
    <div class="header-right">
      <div class="stats" id="stats">
        <span>⏳ загрузка...</span>
      </div>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="ai">🤖 AI</button>
    <button class="filter-btn" data-filter="infra">🔧 Инфра</button>
    <button class="filter-btn" data-filter="finance">📈 Финансы</button>
    <button class="filter-btn" data-filter="media">🎙️ Медиа</button>
    <button class="filter-btn" data-filter="data">📊 Данные</button>
    <button class="filter-btn" data-filter="online">🟢 Online</button>
    <button class="filter-btn" data-filter="starred">⭐ Избранное</button>
  </div>

  <div class="search">
    <input type="text" id="search" placeholder="🔍 Поиск проектов..." autofocus>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    Сканирую сервер...
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">
    <div class="icon">🔍</div>
    <p>Ничего не найдено</p>
  </div>

  <div class="footer">
    <span>✦</span> Tailscale: <span>instance-20260807-1651</span> &nbsp;·&nbsp; Oracle Cloud &nbsp;·&nbsp; 1GB RAM &nbsp;·&nbsp; 45GB SSD <span>✦</span>
  </div>

<script>
const CATEGORY_COLORS = {
  ai: { bg: '#6366f122', color: '#818cf8' },
  infra: { bg: '#f59e0b22', color: '#fbbf24' },
  finance: { bg: '#22c55e22', color: '#4ade80' },
  media: { bg: '#ec489922', color: '#f472b6' },
  data: { bg: '#06b6d422', color: '#22d3ee' },
};

let projects = [];
let activeFilter = 'all';
let searchQuery = '';

async function load() {
  try {
    const res = await fetch('/api/portal/catalog');
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    projects = data.projects;
    document.getElementById('loading').classList.add('hidden');
    render();
  } catch (e) {
    // Fallback: load from embedded data
    document.getElementById('loading').innerHTML = '⚠️ Не удалось загрузить каталог';
  }
}

function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const stats = document.getElementById('stats');

  const filtered = projects.filter(p => {
    const matchFilter = activeFilter === 'all' ||
      (activeFilter === 'online' && p.status?.online) ||
      (activeFilter === 'starred' && p.starred) ||
      p.category === activeFilter;
    const matchSearch = !searchQuery ||
      p.name.toLowerCase().includes(searchQuery) ||
      p.description.toLowerCase().includes(searchQuery) ||
      p.tags?.some(t => t.includes(searchQuery));
    return matchFilter && matchSearch;
  });

  const online = projects.filter(p => p.status?.online).length;
  stats.innerHTML = `
    <span>📦 ${projects.length}</span>
    <span><span class="dot-online"></span> ${online}</span>
    <span><span class="dot-offline"></span> ${projects.length - online}</span>
  `;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  grid.innerHTML = filtered.map(p => {
    const cat = CATEGORY_COLORS[p.category] || { bg: '#333', color: '#999' };
    const isOnline = p.status?.online;
    return `
      <a href="${p.url}" class="card${p.starred ? ' starred' : ''}" target="_blank">
        <div class="card-top">
          <div class="card-icon">${p.icon}</div>
          <div class="card-info">
            <div class="card-title">${p.name}</div>
            <div class="card-desc">${p.description}</div>
          </div>
        </div>
        <div class="card-tags">
          ${(p.tags || []).slice(0, 3).map(t => `<span class="card-tag" style="background:${cat.bg};color:${cat.color}">${t}</span>`).join('')}
          <span class="card-tag" style="background:${cat.bg};color:${cat.color}">${p.category}</span>
        </div>
        <div class="card-status">
          <span class="status-badge ${isOnline ? 'online' : 'offline'}">
            ${isOnline ? '🟢 Online' : '🔴 ' + (p.status?.message || 'Offline')}
          </span>
          <div class="card-actions">
            <span class="btn-open">Открыть</span>
          </div>
        </div>
      </a>
    `;
  }).join('');
}

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  };
});

// Search
document.getElementById('search').oninput = (e) => {
  searchQuery = e.target.value.toLowerCase();
  render();
};

load();
</script>
</body>
</html>
